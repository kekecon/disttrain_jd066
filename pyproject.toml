[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kekecon-disttrain_jd066"
version = "0.1.0"
description = "从输入中抽取数值，计算分布式训练框架工程师·注意力核��的访存瓶颈相关的比值与占比，分母为零时明确报错"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "kekecon" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://kekecon.github.io"
Repository = "https://github.com/kekecon/disttrain_jd066"
Issues = "https://github.com/kekecon/disttrain_jd066/issues"

[project.scripts]
disttrain_jd066 = "disttrain_jd066:main"

[tool.setuptools]
py-modules = ["disttrain_jd066"]
